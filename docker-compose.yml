name: atoll
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: atoll
      POSTGRES_DB: atoll
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: UTC
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atoll -d atoll"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    networks: [internal]

  app:
    build: { context: ., target: runner, secrets: [corp_ca] }
    image: atoll-app:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://atoll:${POSTGRES_PASSWORD}@db:5432/atoll
      REDIS_URL: redis://redis:6379
      STOCK_DIR: /app/stock
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    ports: ["127.0.0.1:${APP_PORT:-3100}:3000"] # only nginx on the host can reach it
    volumes:
      - ${MEDIA_DIR:-./media}:/app/public/media:ro
      - nextcache:/app/.next/cache
      # OSK sale-car photos uploaded in /admin/sales (outside the release dir so deploys keep them; owned by uid 1001)
      - ${STOCK_HOST_DIR:-/srv/atoll/stock}:/app/stock
    networks: [internal]

  # Second replica of the same image: nginx balances across both and retries on the other one,
  # and deploys restart them one at a time, so a deploy never takes the site down.
  app2:
    image: atoll-app:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://atoll:${POSTGRES_PASSWORD}@db:5432/atoll
      REDIS_URL: redis://redis:6379
      STOCK_DIR: /app/stock
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    ports: ["127.0.0.1:${APP2_PORT:-3101}:3000"]
    networks: [internal]
    volumes:
      - ${MEDIA_DIR:-./media}:/app/public/media:ro
      - nextcache2:/app/.next/cache
      - ${STOCK_HOST_DIR:-/srv/atoll/stock}:/app/stock

  tools:
    build: { context: ., target: build, secrets: [corp_ca] }
    image: atoll-tools:latest
    profiles: ["tools"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://atoll:${POSTGRES_PASSWORD}@db:5432/atoll
    depends_on:
      db: { condition: service_healthy }
    volumes:
      - ${IMPORT_DIR:-./import}:/import:ro
    networks: [internal]

secrets:
  # Corporate TLS-inspection CA for builds behind the FortiGate; /dev/null when not needed.
  corp_ca:
    file: ${CORP_CA_FILE:-/dev/null}

volumes:
  pgdata:
  nextcache:
  nextcache2:

networks:
  internal:
